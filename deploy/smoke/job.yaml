apiVersion: batch/v1
kind: Job
metadata:
  name: auth-smoke
  annotations:
    # A Job's pod template cannot change; Flux recreates it when the image tag (the released version) changes.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        # pwuser in the Playwright image.
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: smoke
          image: ghcr.io/cglc-main/auth-e2e
          env:
            - { name: E2E_SMOKE, value: "1" }
            - { name: E2E_DOMAIN, value: bulbashenko.com }
            - { name: E2E_EDGE, value: dns }
            - { name: E2E_TEST_CERT, value: "0" }
          resources:
            # Chromium: 339 MiB measured locally. The request stays below that: the cluster has no room to reserve
            # it, and an unschedulable smoke pod would revert a good release (cglc-main/docs, architecture.md: memory).
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: tmp, emptyDir: {} }
        # Chromium needs more shared memory than the default 64 MB.
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 256Mi } }
