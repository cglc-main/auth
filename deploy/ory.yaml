            limits: { memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/config/hydra }
            - { name: internal-ca, mountPath: /etc/internal-ca, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
