# Ory services. Configs come from ConfigMaps generated from ory/ (the root kustomization.yaml); DSNs and secrets from
# the Secret `auth` and the CA of the Postgres server certificate from the ConfigMap `internal-ca`, both provided by
# the deploying side (README "Deploy"). Service names match the test stack, so the configs' internal URLs
# (kratos:4433, hydra:4445, keto:4466) work in both.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kratos
spec:
  replicas: 2
  # Available only after staying ready past the liveness window (10 s × 3, plus the start); a version that dies
  # sooner never replaces an old pod and the bot reverts the version (cglc-main/docs delivery.md).
  minReadySeconds: 45
  progressDeadlineSeconds: 300
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: kratos }
  template:
    metadata:
      labels: { app: kratos }
    spec:
      # Tier 1 (cluster PriorityClass): keeps running when a node is lost. Two replicas on different nodes.
      priorityClassName: tier-1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app: kratos } }
          matchLabelKeys: [pod-template-hash]
      securityContext:
        runAsNonRoot: true
        # Image users are named (ory/nonroot); the kubelet needs a numeric id to verify non-root.
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: migrate
          image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
          args: ["migrate", "sql", "-e", "--yes", "-c", "/etc/config/kratos/kratos.yml"]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 256Mi }
          env:
            - { name: SQA_OPT_OUT, value: "true" }
            - { name: DSN, valueFrom: { secretKeyRef: { name: auth, key: KRATOS_DSN } } }
          volumeMounts:
            - { name: config, mountPath: /etc/config/kratos }
            - { name: internal-ca, mountPath: /etc/internal-ca, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: kratos
          image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
          # Mail goes out from kratos-courier: with two replicas here, two couriers would send twice.
          args: ["serve", "-c", "/etc/config/kratos/kratos.yml"]
          env:
            - { name: SQA_OPT_OUT, value: "true" }
            - { name: LOG_LEVEL, value: info }
            # Go does not know the container limit; without this its heap grows past it between collections. Each
            # argon2 hash takes 64 MB (kratos.yml), and routes.yaml lets at most four run at once (limit-inflight).
            - { name: GOMEMLIMIT, value: 400MiB }
            - { name: DSN, valueFrom: { secretKeyRef: { name: auth, key: KRATOS_DSN } } }
            - { name: SECRETS_COOKIE, valueFrom: { secretKeyRef: { name: auth, key: KRATOS_SECRETS_COOKIE } } }
            - { name: SECRETS_DEFAULT, valueFrom: { secretKeyRef: { name: auth, key: KRATOS_SECRETS_DEFAULT } } }
            - { name: SECRETS_CIPHER, valueFrom: { secretKeyRef: { name: auth, key: KRATOS_SECRETS_CIPHER } } }
            - { name: SECRETS_PAGINATION, valueFrom: { secretKeyRef: { name: auth, key: KRATOS_SECRETS_PAGINATION } } }
            - { name: COURIER_SMTP_CONNECTION_URI, valueFrom: { secretKeyRef: { name: auth, key: SMTP_CONNECTION_URI } } }
            - { name: COURIER_SMTP_FROM_ADDRESS, valueFrom: { secretKeyRef: { name: auth, key: SMTP_SENDER } } }
          ports:
            - { name: public, containerPort: 4433 }
            - { name: admin, containerPort: 4434 }
          readinessProbe:
            httpGet: { path: /admin/health/ready, port: admin }
          livenessProbe:
            httpGet: { path: /admin/health/alive, port: admin }
          resources:
            requests: { cpu: 20m, memory: 80Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/config/kratos }
            - { name: internal-ca, mountPath: /etc/internal-ca, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        # CA for verify-full to Postgres (sslrootcert in the DSN).
        - name: internal-ca
          configMap: { name: internal-ca }
        - name: config
          projected:
            sources:
              - configMap: { name: kratos-config }
              - configMap:
                  name: kratos-courier-templates
                  items:
                    - { key: recovery_code.invalid.email.body.gotmpl, path: courier-templates/recovery_code/invalid/email.body.gotmpl }
                    - { key: recovery_code.invalid.email.body.plaintext.gotmpl, path: courier-templates/recovery_code/invalid/email.body.plaintext.gotmpl }
                    - { key: recovery_code.invalid.email.subject.gotmpl, path: courier-templates/recovery_code/invalid/email.subject.gotmpl }
                    - { key: recovery_code.valid.email.body.gotmpl, path: courier-templates/recovery_code/valid/email.body.gotmpl }
                    - { key: recovery_code.valid.email.body.plaintext.gotmpl, path: courier-templates/recovery_code/valid/email.body.plaintext.gotmpl }
                    - { key: recovery_code.valid.email.subject.gotmpl, path: courier-templates/recovery_code/valid/email.subject.gotmpl }
                    - { key: verification_code.invalid.email.body.gotmpl, path: courier-templates/verification_code/invalid/email.body.gotmpl }
                    - { key: verification_code.invalid.email.body.plaintext.gotmpl, path: courier-templates/verification_code/invalid/email.body.plaintext.gotmpl }
                    - { key: verification_code.invalid.email.subject.gotmpl, path: courier-templates/verification_code/invalid/email.subject.gotmpl }
                    - { key: verification_code.valid.email.body.gotmpl, path: courier-templates/verification_code/valid/email.body.gotmpl }
                    - { key: verification_code.valid.email.body.plaintext.gotmpl, path: courier-templates/verification_code/valid/email.body.plaintext.gotmpl }
                    - { key: verification_code.valid.email.subject.gotmpl, path: courier-templates/verification_code/valid/email.subject.gotmpl }
---
apiVersion: v1
kind: Service
metadata:
  name: kratos
spec:
  selector: { app: kratos }
  ports:
    - { name: public, port: 4433, targetPort: public }
    - { name: admin, port: 4434, targetPort: admin }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kratos-courier
spec:
  # One sender: recovery and verification codes.
  replicas: 1
  # Never two senders, even for a moment: the old pod goes before the new one starts (maxSurge 0). Not
  # `Recreate`: the live object carries the default rollingUpdate, and server-side apply refuses Recreate next to
  # it. No probes; a crash loop keeps it unavailable past the deadline and the bot reverts the version (cglc-main/docs
  # delivery.md). Mail waits in the database meanwhile.
  minReadySeconds: 30
  progressDeadlineSeconds: 300
  strategy:
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels: { app: kratos-courier }
  template:
    metadata:
      labels: { app: kratos-courier }
    spec:
      priorityClassName: tier-1
      securityContext:
        runAsNonRoot: true
        # Image users are named (ory/nonroot); the kubelet needs a numeric id to verify non-root.
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: courier
          image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
          args: ["courier", "watch", "-c", "/etc/config/kratos/kratos.yml"]
          env:
            - { name: SQA_OPT_OUT, value: "true" }
            - { name: LOG_LEVEL, value: info }
            - { name: GOMEMLIMIT, value: 100MiB }
            - { name: DSN, valueFrom: { secretKeyRef: { name: auth, key: KRATOS_DSN } } }
            - { name: SECRETS_COOKIE, valueFrom: { secretKeyRef: { name: auth, key: KRATOS_SECRETS_COOKIE } } }
            - { name: SECRETS_DEFAULT, valueFrom: { secretKeyRef: { name: auth, key: KRATOS_SECRETS_DEFAULT } } }
            - { name: SECRETS_CIPHER, valueFrom: { secretKeyRef: { name: auth, key: KRATOS_SECRETS_CIPHER } } }
            - { name: SECRETS_PAGINATION, valueFrom: { secretKeyRef: { name: auth, key: KRATOS_SECRETS_PAGINATION } } }
            - { name: COURIER_SMTP_CONNECTION_URI, valueFrom: { secretKeyRef: { name: auth, key: SMTP_CONNECTION_URI } } }
            - { name: COURIER_SMTP_FROM_ADDRESS, valueFrom: { secretKeyRef: { name: auth, key: SMTP_SENDER } } }
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/config/kratos }
            - { name: internal-ca, mountPath: /etc/internal-ca, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        # CA for verify-full to Postgres (sslrootcert in the DSN).
        - name: internal-ca
          configMap: { name: internal-ca }
        - name: config
          projected:
            sources:
              - configMap: { name: kratos-config }
              - configMap:
                  name: kratos-courier-templates
                  items:
                    - { key: recovery_code.invalid.email.body.gotmpl, path: courier-templates/recovery_code/invalid/email.body.gotmpl }
                    - { key: recovery_code.invalid.email.body.plaintext.gotmpl, path: courier-templates/recovery_code/invalid/email.body.plaintext.gotmpl }
                    - { key: recovery_code.invalid.email.subject.gotmpl, path: courier-templates/recovery_code/invalid/email.subject.gotmpl }
                    - { key: recovery_code.valid.email.body.gotmpl, path: courier-templates/recovery_code/valid/email.body.gotmpl }
                    - { key: recovery_code.valid.email.body.plaintext.gotmpl, path: courier-templates/recovery_code/valid/email.body.plaintext.gotmpl }
                    - { key: recovery_code.valid.email.subject.gotmpl, path: courier-templates/recovery_code/valid/email.subject.gotmpl }
                    - { key: verification_code.invalid.email.body.gotmpl, path: courier-templates/verification_code/invalid/email.body.gotmpl }
                    - { key: verification_code.invalid.email.body.plaintext.gotmpl, path: courier-templates/verification_code/invalid/email.body.plaintext.gotmpl }
                    - { key: verification_code.invalid.email.subject.gotmpl, path: courier-templates/verification_code/invalid/email.subject.gotmpl }
                    - { key: verification_code.valid.email.body.gotmpl, path: courier-templates/verification_code/valid/email.body.gotmpl }
                    - { key: verification_code.valid.email.body.plaintext.gotmpl, path: courier-templates/verification_code/valid/email.body.plaintext.gotmpl }
                    - { key: verification_code.valid.email.subject.gotmpl, path: courier-templates/verification_code/valid/email.subject.gotmpl }
---
apiVersion: apps/v1
