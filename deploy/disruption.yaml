# Node drains (kured reboots, k3s upgrades) take one replica at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kratos
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector: { matchLabels: { app: kratos } }
