# After `test` passed on main: a release (semantic-release, cglc-main/.github), its images tagged with the version
# (each scanned by Trivy before it is pushed; a critical vulnerability with a fix available stops the release), then
# Renovate at once, which proposes the version to cglc-main/infra. Flux deploys it, smoke-tests it and reverts it on
# failure. Flow: cglc-main/docs delivery.md.
name: release

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    uses: cglc-main/.github/.github/workflows/release.yml@main
    with:
      sha: ${{ github.event.workflow_run.head_sha }}

  images:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: ${{ needs.release.outputs.version }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each image: build, scan, push. The last one pushed is the one infra's Renovate watches, so every image
      # of the release exists before infra is asked to deploy it.
      - name: auth-ui (build)
        uses: docker/build-push-action@v7
        with:
          context: ui
          load: true
          tags: ${{ env.REGISTRY }}/auth-ui:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=auth-ui
          cache-to: type=gha,mode=max,scope=auth-ui
      - name: auth-ui (scan)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/auth-ui:${{ env.VERSION }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: auth-ui (push)
        run: docker push "${REGISTRY}/auth-ui:${VERSION}"
      - name: auth-e2e (build)
        uses: docker/build-push-action@v7
        with:
          context: e2e
          load: true
          tags: ${{ env.REGISTRY }}/auth-e2e:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
          build-args: REVISION=${{ env.SHA }}
          cache-from: type=gha,scope=auth-e2e
          cache-to: type=gha,mode=max,scope=auth-e2e
      - name: auth-e2e (scan)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/auth-e2e:${{ env.VERSION }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: auth-e2e (push)
        run: docker push "${REGISTRY}/auth-e2e:${VERSION}"
  deliver:
    needs: [release, images]
    runs-on: ubuntu-24.04
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: .github
      - name: Renovate on infra now
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh workflow run renovate.yml -R ${{ github.repository_owner }}/.github -f repository=${{ github.repository_owner }}/infra
