# After `test` passed on main: a release (semantic-release, cglc-main/.github), its images tagged with the version
# (each scanned by Trivy before it is pushed; a critical vulnerability with a fix available stops the release), then
# Renovate at once, which proposes the version to cglc-main/infra. Flux deploys it, smoke-tests it and reverts it on
# failure. Flow: cglc-main/docs delivery.md.
name: release

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    uses: cglc-main/.github/.github/workflows/release.yml@12020eafd8d6eb6d051c6a3f13239d49b5343eb4 # main
    with:
      sha: ${{ github.event.workflow_run.head_sha }}

  images:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: ${{ needs.release.outputs.version }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      # Trivy (the official image; scans the image the build loaded into the runner's Docker) keeps its vulnerability
      # database here, so the job downloads it once.
      TRIVY_CACHE_DIR: /github/home/.cache/trivy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each image: build, scan, push. The last one pushed is the one infra's Renovate watches, so every image
      # of the release exists before infra is asked to deploy it.
      - name: auth-ui (build)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ui
          load: true
          tags: ${{ env.REGISTRY }}/auth-ui:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=auth-ui
          cache-to: type=gha,mode=max,scope=auth-ui
      - name: auth-ui (scan)
        uses: docker://ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        with:
          args: image --severity CRITICAL --ignore-unfixed --exit-code 1 ${{ env.REGISTRY }}/auth-ui:${{ env.VERSION }}
      - name: auth-ui (push)
        run: docker push "${REGISTRY}/auth-ui:${VERSION}"
      - name: auth-e2e (build)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: e2e
          load: true
          tags: ${{ env.REGISTRY }}/auth-e2e:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
          build-args: REVISION=${{ env.SHA }}
          cache-from: type=gha,scope=auth-e2e
          cache-to: type=gha,mode=max,scope=auth-e2e
      - name: auth-e2e (scan)
        uses: docker://ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        with:
          args: image --severity CRITICAL --ignore-unfixed --exit-code 1 ${{ env.REGISTRY }}/auth-e2e:${{ env.VERSION }}
      - name: auth-e2e (push)
        run: docker push "${REGISTRY}/auth-e2e:${VERSION}"
  deliver:
    needs: [release, images]
    runs-on: ubuntu-24.04
    steps:
      - id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: .github
      - name: Renovate on infra now
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh workflow run renovate.yml -R ${{ github.repository_owner }}/.github -f repository=${{ github.repository_owner }}/infra
