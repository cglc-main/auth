# The PR title becomes the squashed commit that semantic-release reads (cglc-main/.github, pr-title.yml).
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    uses: cglc-main/.github/.github/workflows/pr-title.yml@05c2594b865c10033d9e51f8a1a447c062d133f9 # main
